    <title>QINLING FIELD NOTES</title>
    <script>
      // Apply the saved appearance before first paint (no light/dark flash on launch).
      (function () {
        try {
          var a = localStorage.getItem('qfn.appearance') || 'system';
          var dark = a === 'dark' || (a === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (e) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
